<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Personal Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🧪 Test Personal Task Manager</h1>
    <div id="test-results"></div>

    <script>
        function addTestResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.textContent = message;
            resultsDiv.appendChild(resultDiv);
        }

        // Test localStorage
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            addTestResult('✅ localStorage hoạt động bình thường', 'success');
        } catch (error) {
            addTestResult('❌ localStorage không khả dụng: ' + error.message, 'error');
        }

        // Test JSON
        try {
            const testData = { tasks: [], goals: [], settings: {} };
            const jsonString = JSON.stringify(testData);
            const parsedData = JSON.parse(jsonString);
            addTestResult('✅ JSON hoạt động bình thường', 'success');
        } catch (error) {
            addTestResult('❌ JSON không khả dụng: ' + error.message, 'error');
        }

        // Test Date
        try {
            const now = new Date();
            const isoString = now.toISOString();
            addTestResult('✅ Date API hoạt động bình thường', 'success');
        } catch (error) {
            addTestResult('❌ Date API không khả dụng: ' + error.message, 'error');
        }

        // Test fetch (for location)
        if (typeof fetch !== 'undefined') {
            addTestResult('✅ Fetch API có sẵn', 'success');
        } else {
            addTestResult('⚠️ Fetch API không có sẵn (có thể cần polyfill)', 'error');
        }

        // Test geolocation
        if (navigator.geolocation) {
            addTestResult('✅ Geolocation API có sẵn', 'success');
        } else {
            addTestResult('⚠️ Geolocation API không có sẵn', 'error');
        }

        addTestResult('🎯 Test hoàn thành! Nếu tất cả đều ✅ thì ứng dụng sẽ hoạt động tốt.', 'info');
    </script>
</body>
</html>
