<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công Việc & Mục Tiêu</title>
    
    <!-- Tích hợp Fonts từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <!-- Toàn bộ CSS của trang web được đặt trong thẻ <style> này -->
    <style>
        /* --- BIẾN MÀU VÀ FONT CHỮ --- */
        :root {
            --primary-blue: #005B96;
            --primary-orange: #FF7A00;
            --secondary-orange: #ff9d47;
            --light-gray: #f8f9fa;
            --medium-gray: #e9ecef;
            --dark-gray: #6c757d;
            --text-color: #343a40;
            --white: #ffffff;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --gemini-blue: #4285F4;
            --gemini-red: #EA4335;
            --gemini-yellow: #FBBC05;
            --gemini-green: #34A853;
            --font-title: 'Montserrat', sans-serif;
            --font-body: 'UTM Avo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* --- THIẾT LẬP CƠ BẢN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--light-gray);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s;
        }

        /* --- GIAO DIỆN ĐĂNG NHẬP --- */
        #login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-blue), #003f6b);
        }

        .login-box {
            background: var(--white);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .login-box h2 {
            font-family: var(--font-title);
            color: var(--primary-blue);
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .login-box .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        #login-error {
            color: var(--danger-color);
            margin-bottom: 1rem;
            font-weight: bold;
            display: none; /* Mặc định ẩn */
        }

        /* --- CONTAINER CHÍNH CỦA ỨNG DỤNG --- */
        #app-container {
            display: none; /* Mặc định ẩn, chỉ hiện sau khi đăng nhập */
            width: 100%;
            display: flex;
        }

        /* --- THANH ĐIỀU HƯỚNG BÊN TRÁI (SIDEBAR) --- */
        .sidebar {
            width: 260px;
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 2rem 1rem;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            font-family: var(--font-title);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--white);
        }

        .nav-menu {
            list-style: none;
            margin-bottom: 2rem;
            flex-grow: 1; /* Đẩy phần sao lưu xuống dưới */
        }

        .nav-menu li {
            margin-bottom: 0.5rem;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 0.9rem 1rem;
            background: none;
            border: none;
            color: var(--white);
            text-align: left;
            font-size: 1rem;
            font-family: var(--font-body);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .nav-btn.active {
            background-color: var(--primary-orange);
            font-weight: bold;
        }
        
        .sidebar-footer button {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .export-btn {
            background-color: var(--success-color);
            color: var(--white);
            border: 2px solid var(--success-color);
        }
        .export-btn:hover {
            background-color: #218838;
        }
        
        .logout-btn {
            background-color: transparent;
            color: var(--white);
            border: 2px solid var(--white);
        }
        .logout-btn:hover {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* --- VÙNG NỘI DUNG CHÍNH --- */
        .main-content {
            margin-left: 260px; /* Bằng với chiều rộng sidebar */
            width: calc(100% - 260px);
            padding: 2rem;
            overflow-y: auto;
        }

        .content-section {
            display: none; /* Mặc định ẩn tất cả các mục */
            animation: fadeIn 0.5s ease-in-out;
        }

        .content-section.active {
            display: block; /* Chỉ hiện mục được chọn */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: var(--font-title);
            color: var(--primary-blue);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--primary-orange);
            padding-bottom: 0.5rem;
        }

        /* --- FORM NHẬP LIỆU --- */
        .form-container {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end; /* Căn các item ở dưới cùng */
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-with-gemini {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .input-with-gemini .form-group {
            flex-grow: 1;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn-submit {
            grid-column: 1 / -1;
            padding: 0.9rem;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: var(--font-title);
            background-color: var(--primary-orange);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .btn-submit:hover {
            background-color: #e66a00;
            transform: translateY(-2px);
        }

        .gemini-btn {
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--gemini-blue), var(--gemini-green), var(--gemini-yellow), var(--gemini-red));
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .gemini-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* --- DANH SÁCH HIỂN THỊ CÔNG VIỆC/MỤC TIÊU --- */
        .list-container {
            margin-top: 2rem;
        }

        .list-item {
            background-color: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            border-left: 5px solid var(--primary-blue);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        
        .list-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .item-header h3 {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-blue);
            word-break: break-word;
        }
        
        .item-header.completed h3 {
            text-decoration: line-through;
            color: var(--dark-gray);
        }
        
        .item-body {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .item-detail span {
            font-weight: bold;
            color: var(--dark-gray);
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        
        .item-detail p, .item-detail a {
            word-break: break-all;
        }
        
        .status {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            color: var(--white);
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
        }
        
        .status.not-started { background-color: var(--dark-gray); }
        .status.in-progress { background-color: var(--warning-color); color: var(--text-color); }
        .status.completed { background-color: var(--success-color); }
        
        .item-actions button {
            background: none;
            border: 1px solid var(--medium-gray);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            margin-left: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .item-actions .edit-btn:hover { background-color: var(--warning-color); border-color: var(--warning-color); color: var(--text-color); }
        .item-actions .delete-btn:hover { background-color: var(--danger-color); border-color: var(--danger-color); color: var(--white); }
        .item-actions .complete-btn:hover { background-color: var(--success-color); border-color: var(--success-color); color: var(--white); }

        .export-report-btn {
            display: none;
            padding: 0.8rem 1.5rem;
            background-color: #007bff;
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: background-color 0.3s;
        }
        .export-report-btn:hover {
            background-color: #0069d9;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            max-width: 600px;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }

        .close-btn {
            color: #aaa;
            position: absolute;
            top: 15px; right: 25px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover, .close-btn:focus { color: black; }
        
        .loader-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loader {
            border: 8px solid var(--light-gray);
            border-top: 8px solid var(--primary-blue);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* --- GIAO DIỆN TRÊN ĐIỆN THOẠI (RESPONSIVE) --- */
        @media (max-width: 768px) {
            #app-container { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto;
                position: relative; flex-direction: row;
                align-items: center; padding: 1rem;
                flex-wrap: wrap;
            }
            .sidebar-header { width: 100%; margin-bottom: 1rem; font-size: 1.2rem; }
            .nav-menu { display: flex; flex-grow: 1; margin-bottom: 0; }
            .sidebar-footer { display: flex; gap: 0.5rem; }
            .main-content { margin-left: 0; width: 100%; padding: 1rem; }
            h1 { font-size: 2rem; }
            .form-grid, .input-with-gemini { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
            .gemini-btn { width: 100%; margin-top: 0.5rem; }
            .item-header, .item-body { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .item-actions { margin-top: 1rem; width: 100%; display: flex; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- GIAO DIỆN ĐĂNG NHẬP -->
    <div id="login-container">
        <div class="login-box">
            <h2>Đăng Nhập</h2>
            <p id="login-error">Tên đăng nhập hoặc mật khẩu không đúng!</p>
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" value="lamquocminh">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" value="lamquocminh">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Đăng Nhập</button>
        </div>
    </div>
    
    <!-- CONTAINER CHÍNH CỦA ỨNG DỤNG -->
    <div id="app-container">
        <!-- PHẦN 1: THANH ĐIỀU HƯỚNG (SIDEBAR) -->
        <aside class="sidebar">
            <h2 class="sidebar-header">Bảng Điều Khiển</h2>
            <ul class="nav-menu">
                <li><button class="nav-btn active" onclick="showSection('tasks')">Quản lý công việc</button></li>
                <li><button class="nav-btn" onclick="showSection('goals')">Quản lý mục tiêu</button></li>
            </ul>
            <div class="sidebar-footer">
                <button class="export-btn" onclick="exportDataToFile()">Xuất Dữ Liệu Ra File</button>
                <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
            </div>
        </aside>

        <!-- PHẦN 2: NỘI DUNG CHÍNH -->
        <main class="main-content">
            <!-- CÁC SECTION KHÁC GIỮ NGUYÊN -->
            <!-- MỤC 2.1: QUẢN LÝ CÔNG VIỆC -->
            <section id="tasks" class="content-section active">
                <h1>Quản lý công việc</h1>
                <div class="form-container">
                    <div class="form-grid">
                        <div class="input-with-gemini">
                            <div class="form-group">
                                <label for="task-name">Tên công việc</label>
                                <input type="text" id="task-name" placeholder="Nhập công việc lớn rồi nhấn nút ✨">
                            </div>
                            <button class="gemini-btn" onclick="suggestSubTasks()">✨ Chia nhỏ</button>
                        </div>
                        <div class="form-group"><label for="task-timeframe">Thời hạn</label><select id="task-timeframe"><option value="Ngày">Ngày</option><option value="Tuần">Tuần</option><option value="Tháng">Tháng</option><option value="Quý">Quý</option><option value="Năm">Năm</option></select></div>
                        <div class="form-group"><label for="task-status">Tiến độ</label><select id="task-status"><option value="Chưa thực hiện">Chưa thực hiện</option><option value="Đang thực hiện">Đang thực hiện</option><option value="Đã hoàn thành">Đã hoàn thành</option></select></div>
                        <div class="form-group"><label for="task-link">Link tài liệu</label><input type="text" id="task-link" placeholder="https://..."></div>
                    </div>
                    <button class="btn-submit" onclick="addTask()">Thêm công việc</button>
                </div>
                <button class="export-report-btn" onclick="exportWeeklyReport()">Xuất Báo Cáo Tuần</button>
                <div class="list-container" id="task-list"></div>
            </section>
            <!-- MỤC 2.2: QUẢN LÝ MỤC TIÊU -->
            <section id="goals" class="content-section">
                <h1>Quản lý mục tiêu</h1>
                <div class="form-container">
                    <div class="form-grid">
                        <div class="input-with-gemini">
                            <div class="form-group"><label for="goal-name">Mục tiêu</label><input type="text" id="goal-name" placeholder="Nhập mục tiêu rồi nhấn nút ✨"></div>
                            <button class="gemini-btn" onclick="suggestGoalSteps()">✨ Gợi ý bước</button>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label for="goal-conditions">Việc cần làm để đạt được</label><textarea id="goal-conditions" placeholder="Gemini sẽ gợi ý các bước ở đây..."></textarea></div>
                        <div class="form-group" style="grid-column: 1 / -1;"><label for="goal-link">Link đính kèm</label><input type="text" id="goal-link" placeholder="https://..."></div>
                    </div>
                    <button class="btn-submit" onclick="addGoal()">Thêm mục tiêu</button>
                </div>
                <div class="list-container" id="goal-list"></div>
            </section>
        </main>
    </div>

    <!-- MODAL VÀ SPINNER GIỮ NGUYÊN -->
    <div id="loader-overlay" class="loader-overlay"><div class="loader"></div></div>
    <div id="edit-modal" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeModal()">&times;</span><h2>Chỉnh sửa</h2><div id="edit-modal-body"></div></div></div>

    <!-- PHẦN 4: TOÀN BỘ JAVASCRIPT CỦA TRANG WEB -->
    <script>
        // --- KHAI BÁO BIẾN TOÀN CỤC ---
        let tasks = [];
        let goals = [];
        let editingItemId = null;
        const apiKey = "";

        // --- CÁC HÀM XỬ LÝ ĐĂNG NHẬP / ĐĂNG XUẤT ---
        
        /**
         * Xử lý sự kiện khi người dùng nhấn nút Đăng nhập.
         */
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            // Tài khoản và mật khẩu được hardcode theo yêu cầu
            if (user === 'lamquocminh' && pass === 'lamquocminh') {
                sessionStorage.setItem('isLoggedIn', 'true'); // Lưu trạng thái đăng nhập
                showApp();
                errorEl.style.display = 'none';
            } else {
                errorEl.style.display = 'block'; // Hiển thị lỗi
            }
        }
        
        /**
         * Xử lý sự kiện khi người dùng nhấn nút Đăng xuất.
         */
        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn'); // Xóa trạng thái đăng nhập
            showLoginScreen();
        }

        /**
         * Hiển thị giao diện chính của ứng dụng và ẩn màn hình đăng nhập.
         */
        function showApp() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            loadData(); // Tải dữ liệu sau khi đăng nhập thành công
            renderAll();
        }

        /**
         * Hiển thị màn hình đăng nhập và ẩn giao diện chính.
         */
        function showLoginScreen() {
            document.getElementById('login-container').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
        }

        // --- CÁC HÀM QUẢN LÝ GIAO DIỆN (UI) ---

        function showSection(sectionName) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function toggleLoading(show) {
            const loader = document.getElementById('loader-overlay');
            loader.style.display = show ? 'flex' : 'none';
        }
        
        // --- TÍCH HỢP GEMINI API ---

        async function callGeminiAPI(prompt, retries = 3, delay = 1000) {
            toggleLoading(true);
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    if (result.candidates?.[0]?.content.parts?.[0]?.text) {
                        toggleLoading(false);
                        return result.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Phản hồi từ API không hợp lệ.");
                    }
                } catch (error) {
                    console.error(`Lần thử ${i + 1} thất bại:`, error);
                    if (i === retries - 1) {
                        alert("Đã xảy ra lỗi khi kết nối với Gemini API. Vui lòng thử lại sau.");
                        toggleLoading(false);
                        return null;
                    }
                    await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                }
            }
        }

        async function suggestSubTasks() {
            const mainTaskName = document.getElementById('task-name').value.trim();
            if (!mainTaskName) {
                alert('Vui lòng nhập tên công việc chính trước khi chia nhỏ.');
                return;
            }
            const prompt = `Với vai trò là một trợ lý quản lý dự án, hãy chia nhỏ công việc chính sau đây thành các công việc con cụ thể, có thể hành động được. Chỉ trả lời bằng danh sách có gạch đầu dòng (-), không thêm bất kỳ lời dẫn hay câu kết nào:\n\n"${mainTaskName}"`;
            const result = await callGeminiAPI(prompt);
            if (result) {
                const subTasks = result.split('\n').filter(line => line.trim().startsWith('-')).map(line => line.trim().substring(1).trim());
                if (subTasks.length === 0) {
                    alert("Gemini không thể chia nhỏ công việc này. Vui lòng thử một công việc khác rõ ràng hơn.");
                    return;
                }
                const timeframe = document.getElementById('task-timeframe').value;
                subTasks.forEach(subTaskName => {
                    tasks.push({
                        id: Date.now() + Math.random(),
                        name: `${mainTaskName}: ${subTaskName}`,
                        timeframe: timeframe,
                        status: 'Chưa thực hiện',
                        link: ''
                    });
                });
                saveData();
                renderTasks();
                document.getElementById('task-name').value = ''; 
            }
        }
        
        async function suggestGoalSteps() {
            const mainGoalName = document.getElementById('goal-name').value.trim();
            if (!mainGoalName) {
                alert('Vui lòng nhập mục tiêu chính trước khi cần gợi ý.');
                return;
            }
            const prompt = `Với vai trò là một cố vấn hoạch định chiến lược, hãy gợi ý các bước hành động cụ thể (actionable steps) để đạt được mục tiêu sau. Trình bày dưới dạng danh sách gạch đầu dòng (-), không thêm bất kỳ lời dẫn hay câu kết nào:\n\n"${mainGoalName}"`;
            const result = await callGeminiAPI(prompt);
            if (result) {
                document.getElementById('goal-conditions').value = result;
            }
        }

        // --- CÁC HÀM XỬ LÝ DỮ LIỆU ---

        function saveData() {
            const appData = { tasks: tasks, goals: goals };
            localStorage.setItem('personalManagerData', JSON.stringify(appData));
            checkAndDisplayExportButton();
        }

        function loadData() {
            const savedData = localStorage.getItem('personalManagerData');
            if (savedData) {
                const appData = JSON.parse(savedData);
                tasks = appData.tasks || [];
                goals = appData.goals || [];
            }
        }

        function exportDataToFile() {
            const appData = { tasks: tasks, goals: goals };
            const dataStr = JSON.stringify(appData, null, 2); 
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            const date = new Date().toISOString().slice(0, 10);
            link.download = `DuLieu-QuanLyCongViec-${date}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // --- QUẢN LÝ CÔNG VIỆC ---
        function addTask() {
            const name = document.getElementById('task-name').value.trim();
            if (!name) { alert('Vui lòng nhập tên công việc.'); return; }
            tasks.push({
                id: Date.now(), name,
                timeframe: document.getElementById('task-timeframe').value,
                status: document.getElementById('task-status').value,
                link: document.getElementById('task-link').value.trim()
            });
            saveData(); renderTasks();
            document.getElementById('task-name').value = '';
            document.getElementById('task-link').value = '';
        }
        function deleteTask(id) {
            if (confirm('Bạn có chắc chắn muốn xóa công việc này?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveData(); renderTasks();
            }
        }
        function completeTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.status = 'Đã hoàn thành'; saveData(); renderTasks(); }
        }
        function renderTasks() {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            if (tasks.length === 0) { taskList.innerHTML = '<p style="text-align: center; color: var(--dark-gray);">Chưa có công việc nào.</p>'; return; }
            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'list-item';
                let sClass = task.status === 'Chưa thực hiện' ? 'not-started' : (task.status === 'Đang thực hiện' ? 'in-progress' : 'completed');
                item.innerHTML = `
                    <div class="item-header ${task.status === 'Đã hoàn thành' ? 'completed' : ''}">
                        <h3>${task.name}</h3>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="openEditModal('task', ${task.id})">Sửa</button>
                            <button class="delete-btn" onclick="deleteTask(${task.id})">Xóa</button>
                            ${task.status !== 'Đã hoàn thành' ? `<button class="complete-btn" onclick="completeTask(${task.id})">Hoàn thành</button>` : ''}
                        </div>
                    </div>
                    <div class="item-body">
                        <div class="item-detail"><span>Thời hạn</span><p>${task.timeframe}</p></div>
                        <div class="item-detail"><span>Tiến độ</span><p><span class="status ${sClass}">${task.status}</span></p></div>
                        <div class="item-detail"><span>Tài liệu</span><p>${task.link ? `<a href="${task.link}" target="_blank" rel="noopener noreferrer">${task.link}</a>` : 'Không có'}</p></div>
                    </div>`;
                taskList.appendChild(item);
            });
        }
        
        // --- XUẤT BÁO CÁO ---
        function checkAndDisplayExportButton() {
            const btn = document.querySelector('.export-report-btn');
            const weekly = tasks.filter(t => t.timeframe === 'Tuần');
            btn.style.display = (weekly.length > 0 && weekly.every(t => t.status === 'Đã hoàn thành')) ? 'block' : 'none';
        }
        function exportWeeklyReport() {
            const completed = tasks.filter(t => t.timeframe === 'Tuần' && t.status === 'Đã hoàn thành');
            if (completed.length === 0) return;
            let csv = "data:text/csv;charset=utf-8,Tên Công Việc,Tiến Độ,Link Tài Liệu\r\n";
            completed.forEach(t => { csv += `"${t.name}","${t.status}","${t.link}"\r\n`; });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `bao-cao-tuan-${new Date().toISOString().slice(0, 10)}.csv`);
            link.click();
        }

        // --- QUẢN LÝ MỤC TIÊU ---
        function addGoal() {
            const name = document.getElementById('goal-name').value.trim();
            if (!name) { alert('Vui lòng nhập tên mục tiêu.'); return; }
            goals.push({
                id: Date.now(), name,
                conditions: document.getElementById('goal-conditions').value.trim(),
                link: document.getElementById('goal-link').value.trim(),
                completed: false
            });
            saveData(); renderGoals();
            document.getElementById('goal-name').value = '';
            document.getElementById('goal-conditions').value = '';
            document.getElementById('goal-link').value = '';
        }
        function deleteGoal(id) {
            if (confirm('Bạn có chắc chắn muốn xóa mục tiêu này?')) {
                goals = goals.filter(g => g.id !== id);
                saveData(); renderGoals();
            }
        }
        function toggleGoalCompletion(id) {
            const goal = goals.find(g => g.id === id);
            if (goal) { goal.completed = !goal.completed; saveData(); renderGoals(); }
        }
        function renderGoals() {
            const goalList = document.getElementById('goal-list');
            goalList.innerHTML = '';
            if (goals.length === 0) { goalList.innerHTML = '<p style="text-align: center; color: var(--dark-gray);">Chưa có mục tiêu nào.</p>'; return; }
            goals.forEach(goal => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="item-header ${goal.completed ? 'completed' : ''}">
                        <h3>${goal.name}</h3>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="openEditModal('goal', ${goal.id})">Sửa</button>
                            <button class="delete-btn" onclick="deleteGoal(${goal.id})">Xóa</button>
                            <button class="complete-btn" onclick="toggleGoalCompletion(${goal.id})">${goal.completed ? 'Bỏ hoàn thành' : 'Hoàn thành'}</button>
                        </div>
                    </div>
                    <div class="item-body" style="grid-template-columns: 1fr;">
                        <div class="item-detail"><span>Việc cần làm</span><p style="white-space: pre-wrap;">${goal.conditions || 'Không có'}</p></div>
                        <div class="item-detail"><span>Link đính kèm</span><p>${goal.link ? `<a href="${goal.link}" target="_blank" rel="noopener noreferrer">${goal.link}</a>` : 'Không có'}</p></div>
                    </div>`;
                goalList.appendChild(item);
            });
        }
        
        // --- MODAL CHỈNH SỬA ---
        function openEditModal(type, id) {
            editingItemId = id;
            const modal = document.getElementById('edit-modal'), body = document.getElementById('edit-modal-body');
            if (type === 'task') {
                const t = tasks.find(i => i.id === id);
                body.innerHTML = `
                    <div class="form-group"><label>Tên</label><input id="edit-task-name" value="${t.name}"></div>
                    <div class="form-group"><label>Thời hạn</label><select id="edit-task-timeframe"><option ${t.timeframe === 'Ngày' ? 'selected' : ''}>Ngày</option><option ${t.timeframe === 'Tuần' ? 'selected' : ''}>Tuần</option><option ${t.timeframe === 'Tháng' ? 'selected' : ''}>Tháng</option><option ${t.timeframe === 'Quý' ? 'selected' : ''}>Quý</option><option ${t.timeframe === 'Năm' ? 'selected' : ''}>Năm</option></select></div>
                    <div class="form-group"><label>Tiến độ</label><select id="edit-task-status"><option ${t.status === 'Chưa thực hiện' ? 'selected' : ''}>Chưa thực hiện</option><option ${t.status === 'Đang thực hiện' ? 'selected' : ''}>Đang thực hiện</option><option ${t.status === 'Đã hoàn thành' ? 'selected' : ''}>Đã hoàn thành</option></select></div>
                    <div class="form-group"><label>Link</label><input id="edit-task-link" value="${t.link}"></div>
                    <button class="btn-submit" onclick="saveTaskChanges()">Lưu</button>`;
            } else if (type === 'goal') {
                const g = goals.find(i => i.id === id);
                body.innerHTML = `
                    <div class="form-group"><label>Mục tiêu</label><input id="edit-goal-name" value="${g.name}"></div>
                    <div class="form-group"><label>Việc cần làm</label><textarea id="edit-goal-conditions">${g.conditions}</textarea></div>
                    <div class="form-group"><label>Link</label><input id="edit-goal-link" value="${g.link}"></div>
                    <button class="btn-submit" onclick="saveGoalChanges()">Lưu</button>`;
            }
            modal.style.display = 'block';
        }
        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; editingItemId = null; }
        function saveTaskChanges() {
            const t = tasks.find(i => i.id === editingItemId);
            if (t) {
                t.name = document.getElementById('edit-task-name').value.trim();
                t.timeframe = document.getElementById('edit-task-timeframe').value;
                t.status = document.getElementById('edit-task-status').value;
                t.link = document.getElementById('edit-task-link').value.trim();
                saveData(); renderTasks(); closeModal();
            }
        }
        function saveGoalChanges() {
            const g = goals.find(i => i.id === editingItemId);
            if (g) {
                g.name = document.getElementById('edit-goal-name').value.trim();
                g.conditions = document.getElementById('edit-goal-conditions').value.trim();
                g.link = document.getElementById('edit-goal-link').value.trim();
                saveData(); renderGoals(); closeModal();
            }
        }
        
        function renderAll() { renderTasks(); renderGoals(); }

        // --- KHỞI CHẠY ỨNG DỤNG ---
        document.addEventListener('DOMContentLoaded', () => {
            // Kiểm tra xem người dùng đã đăng nhập chưa
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showApp();
            } else {
                showLoginScreen();
            }
        });
        
        // Bắt sự kiện nhấn Enter trên ô mật khẩu để đăng nhập
        document.getElementById('password').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.querySelector('.login-box .btn-submit').click();
            }
        });
        
        window.onclick = (event) => { if (event.target == document.getElementById('edit-modal')) closeModal(); }
    </script>
</body>
</html>
